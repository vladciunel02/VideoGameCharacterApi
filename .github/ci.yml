name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VideoGameCharacterApi.slnx

      - name: Build
        run: dotnet build VideoGameCharacterApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VideoGameCharacterApi.slnx --no-build --configuration Release
